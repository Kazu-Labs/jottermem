name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Install mcp and relay extras (require Python >=3.10)
        if: matrix.python-version != '3.9'
        run: pip install -e ".[mcp]" -e ".[relay]"
      - name: Report sqlite-vec extension-loading support
        run: |
          python -c "import sqlite3; print('enable_load_extension:', hasattr(sqlite3.Connection, 'enable_load_extension'))"
      - run: python -m pytest -v tests/test_sqlite_vec.py
      - name: Run MCP server tests
        if: matrix.python-version != '3.9'
        run: python -m pytest -v tests/test_mcp_server.py tests/test_portable_mcp_server.py
      - name: Run relay tests
        if: matrix.python-version != '3.9'
        run: python -m pytest -v tests/test_relay.py
      - run: python -m pytest -q
      - run: mypy src/jottermem
