[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jottermem"
version = "0.1.1"
description = "A dead-simple, embeddable memory layer for AI apps — single file, zero infra, zero account"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Kazu Labs" }]
keywords = ["memory", "agents", "ai-agents", "agent-memory", "llm", "rag", "sqlite", "embeddings", "vector-search", "long-term-memory", "mcp", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers>=2.2.0"]
sqlite-vec = ["sqlite-vec>=0.1.0"]
mcp = ["mcp>=2.0.0"]
relay = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "mcp>=2.0.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.100.0",
    "cryptography>=42.0.0",
]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "sqlite-vec>=0.1.0", "mypy>=1.10.0"]

[project.urls]
Homepage = "https://github.com/Kazu-Labs/jottermem"
Issues = "https://github.com/Kazu-Labs/jottermem/issues"

[project.scripts]
jottermem-mcp = "jottermem.mcp_server:main"
jottermem-setup = "jottermem.portable.setup:main"
jottermem-portable-mcp = "jottermem.portable.mcp_server:main"
jottermem-app = "jottermem.portable.app:main"
jottermem-relay-admin = "jottermem.relay.admin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jottermem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/jottermem"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "sqlite_vec.*",
    "mcp.*",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.*",
    "fastapi.*",
    "cryptography.*",
]
ignore_missing_imports = true
